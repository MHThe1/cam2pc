[package]
name = "cam2pc"
version = "0.1.0"
description = "Stream your phone camera to PC over LAN — WebRTC, recording, and OBS-ready"
authors = ["Cam2PC Contributors"]
license = "MIT"
repository = "https://github.com/MHThe1/cam2pc"
edition = "2021"
rust-version = "1.77"

[lib]
name = "cam2pc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Embedded HTTP + WebSocket signaling server
axum = { version = "0.7", features = ["ws", "http2"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
rust-embed = "8.5"
mime_guess = "2.0"

# WebSocket
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"

# TLS / cert generation
rcgen = { version = "0.13", features = ["pem"] }
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
axum-server = { version = "0.7", features = ["tls-rustls"] }

# QR code
qrcode = "0.14"
image = { version = "0.25", features = ["png"] }
base64 = "0.22"

# Networking
local-ip-address = "0.6"

# Utilities
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"
dashmap = "6"
anyhow = "1"
thiserror = "2"

[features]
# This feature is used for production builds or when `devtools` feature is not specified in Tauri config.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"   # Strip expensive panic clean-up logic
codegen-units = 1 # Compile crates one at a time for better optimization
opt-level = "s"   # Optimize for binary size
lto = true        # Enable link-time optimization
strip = true      # Strip debug symbols
