name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-desktop:
    name: Build & Publish — Windows Desktop
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies & build
        run: |
          npm ci
          npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Cam2PC ${{ github.ref_name }}'
          releaseBody: |
            ### Cam2PC ${{ github.ref_name }}
            High-performance smartphone webcam streaming for PC.
            
            - **Windows**: Download the `.msi` or `.exe` installer below.
            - **Android**: Download `Cam2PC-Android-${{ github.ref_name }}.apk` below.
          releaseDraft: false
          prerelease: false

  build-android:
    name: Build & Publish — Android Companion App
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Assemble Android APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/Cam2PC-Android-${{ github.ref_name }}.apk

      - name: Attach Android APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-assets/Cam2PC-Android-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
